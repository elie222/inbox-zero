name: inbox-zero-emulator

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emulator
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emulator"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-emulator-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "127.0.0.1:${REDIS_HTTP_PORT}:80"
    depends_on:
      redis:
        condition: service_healthy
