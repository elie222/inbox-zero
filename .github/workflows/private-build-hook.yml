name: Private build hook

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/install-private-build.mjs
      - scripts/install-private-build.test.mjs
      - apps/web/vercel.json
      - .github/workflows/private-build-hook.yml
  push:
    branches: [main]
    paths:
      - scripts/install-private-build.mjs
      - scripts/install-private-build.test.mjs
      - apps/web/vercel.json
      - .github/workflows/private-build-hook.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/install-private-build.test.mjs
