name: Playwright production benchmark

on:
  push:
    branches: [codex/playwright-production-benchmark]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-production-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Mail reader (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
        env:
          SRH_CONNECTION_STRING: redis://redis:6379
          SRH_MODE: env
          SRH_TOKEN: playwright-token
        ports:
          - 8079:80

    env:
      PLAYWRIGHT_SKIP_REPORT_MERGE: "1"
      PLAYWRIGHT_PRODUCTION: ${{ matrix.mode == 'production' && '1' || '0' }}
      NEXT_PUBLIC_EMAIL_SEND_ENABLED: "true"
      NEXT_PUBLIC_MEETING_RECORDER_ENABLED: "true"
      NEXT_PUBLIC_CONTACTS_ENABLED: "false"
      NODE_ENV: development
      NODE_OPTIONS: --max_old_space_size=6144
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: secret
      GOOGLE_CLIENT_ID: client_id
      GOOGLE_CLIENT_SECRET: client_secret
      GOOGLE_BASE_URL: http://localhost:4100
      GOOGLE_PUBSUB_TOPIC_NAME: topic
      EMAIL_ENCRYPT_SECRET: secret
      EMAIL_ENCRYPT_SALT: salt
      INTERNAL_API_KEY: secret
      DEFAULT_LLMS: openai:gpt-5.4-mini
      UPSTASH_REDIS_URL: http://localhost:8079
      UPSTASH_REDIS_TOKEN: playwright-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove checkout credentials
        run: git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bash scripts/pnpm-install-without-desktop.sh --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Setup Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Apply database migrations
        run: pnpm -F inbox-zero-ai exec prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm -F inbox-zero-ai exec playwright install --with-deps chromium

      - name: Build production app once
        if: matrix.mode == 'production'
        run: pnpm -F inbox-zero-ai build:ci
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=16384

      - name: Run mail reader group
        run: >-
          pnpm -F inbox-zero-ai test:playwright:emulated
          mail/reader-visuals.spec.ts
          mail/reader-transition.spec.ts
          mail/thread-states.spec.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
          path: |
            apps/web/.tmp/playwright/blob-report
            apps/web/test-results
          include-hidden-files: true
          compression-level: 1
          retention-days: 7
          if-no-files-found: warn
