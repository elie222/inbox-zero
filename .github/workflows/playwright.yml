name: Playwright

on:
  push:
    branches: [main]
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/hooks/**"
      - "apps/web/providers/**"
      - "apps/web/store/**"
      - "apps/web/styles/**"
      - "apps/web/utils/auth/**"
      - "apps/web/utils/auth.ts"
      - "apps/web/utils/auth-client.ts"
      - "apps/web/utils/middleware.ts"
      - "apps/web/utils/playwright/**"
      - "apps/web/__tests__/playwright/**"
      - "apps/web/emulate.playwright.config.yaml"
      - "apps/web/playwright.config.mjs"
      - "apps/web/scripts/generate-playwright-report-dashboard.ts"
      - "apps/web/scripts/playwright-report-dashboard*"
      - "apps/web/scripts/png-validation*"
      - "apps/web/env.ts"
      - "apps/web/instrumentation.ts"
      - "apps/web/next.config.*"
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      - "scripts/pnpm-install-without-desktop.sh"
      - "scripts/publish-playwright-report.sh"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/publish-playwright-report.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/hooks/**"
      - "apps/web/providers/**"
      - "apps/web/store/**"
      - "apps/web/styles/**"
      - "apps/web/utils/auth/**"
      - "apps/web/utils/auth.ts"
      - "apps/web/utils/auth-client.ts"
      - "apps/web/utils/middleware.ts"
      - "apps/web/utils/playwright/**"
      - "apps/web/__tests__/playwright/**"
      - "apps/web/emulate.playwright.config.yaml"
      - "apps/web/playwright.config.mjs"
      - "apps/web/scripts/generate-playwright-report-dashboard.ts"
      - "apps/web/scripts/playwright-report-dashboard*"
      - "apps/web/scripts/png-validation*"
      - "apps/web/env.ts"
      - "apps/web/instrumentation.ts"
      - "apps/web/next.config.*"
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      - "scripts/pnpm-install-without-desktop.sh"
      - "scripts/publish-playwright-report.sh"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/publish-playwright-report.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select browser specs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      changed_tests: ${{ steps.changes.outputs.PLAYWRIGHT_CHANGED_TEST_FILES }}
    steps:
      - uses: actions/checkout@v4
      - name: Find changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          changed_files_path="$RUNNER_TEMP/changed-files.txt"
          changed_test_files_path="$RUNNER_TEMP/changed-playwright-files.txt"
          : > "$changed_files_path"
          : > "$changed_test_files_path"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
            [[ -n "$BASE_SHA" ]] &&
            [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$GITHUB_SHA" \
              > "$changed_files_path"
            grep '^apps/web/__tests__/playwright/' "$changed_files_path" | \
              sed 's#^apps/web/##' > "$changed_test_files_path" || true
          fi

          delimiter="PLAYWRIGHT_FILES_$(openssl rand -hex 16)"
          {
            echo "PLAYWRIGHT_CHANGED_FILES<<$delimiter"
            cat "$changed_files_path"
            echo "$delimiter"
            echo "PLAYWRIGHT_CHANGED_TEST_FILES<<$delimiter"
            cat "$changed_test_files_path"
            echo "$delimiter"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

      # Checkout's recursive auth cleanup fails on this repository's unmapped gitlink.
      - name: Remove checkout credentials
        run: git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: bash scripts/pnpm-install-without-desktop.sh --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Select isolated specs
        id: targets
        working-directory: apps/web
        run: |
          targets="$(node __tests__/playwright/run-emulated-suite.mjs --list-targets)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  playwright:
    name: E2E ${{ matrix.target.name }}
    needs: select
    if: needs.select.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
        env:
          SRH_CONNECTION_STRING: redis://redis:6379
          SRH_MODE: env
          SRH_TOKEN: playwright-token
        ports:
          - 8079:80

    env:
      PLAYWRIGHT_SKIP_REPORT_MERGE: "1"
      PLAYWRIGHT_CHANGED_TEST_FILES: ${{ needs.select.outputs.changed_tests }}
      NODE_ENV: development
      NODE_OPTIONS: --max_old_space_size=6144
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: secret
      GOOGLE_CLIENT_ID: client_id
      GOOGLE_CLIENT_SECRET: client_secret
      GOOGLE_BASE_URL: http://localhost:4100
      GOOGLE_PUBSUB_TOPIC_NAME: topic
      EMAIL_ENCRYPT_SECRET: secret
      EMAIL_ENCRYPT_SALT: salt
      INTERNAL_API_KEY: secret
      DEFAULT_LLMS: openai:gpt-5.4-mini
      UPSTASH_REDIS_URL: http://localhost:8079
      UPSTASH_REDIS_TOKEN: playwright-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove checkout credentials
        run: git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: bash scripts/pnpm-install-without-desktop.sh --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Setup Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Apply database migrations
        run: pnpm -F inbox-zero-ai exec prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm -F inbox-zero-ai exec playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright_tests
        run: pnpm -F inbox-zero-ai test:playwright:emulated "$TEST_TARGET"
        env:
          TEST_TARGET: ${{ matrix.target.path }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-spec-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target.name }}
          path: |
            apps/web/.tmp/playwright/blob-report
            apps/web/test-results
          include-hidden-files: true
          compression-level: 1
          retention-days: 7
          if-no-files-found: warn

  report:
    name: Web E2E
    needs: [select, playwright]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove checkout credentials
        run: git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: bash scripts/pnpm-install-without-desktop.sh --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Download spec reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-spec-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: apps/web
          merge-multiple: true
      - name: Merge browser reports
        shell: bash
        run: |
          if compgen -G 'apps/web/.tmp/playwright/blob-report/*.zip' > /dev/null; then
            pnpm -F inbox-zero-ai exec playwright merge-reports --reporter=html .tmp/playwright/blob-report
          else
            echo "No browser targets were selected."
          fi
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          compression-level: 1
          retention-days: 7
          if-no-files-found: warn
      - name: Require every selected spec to pass
        if: always()
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          TARGETS: ${{ needs.select.outputs.targets }}
          TEST_RESULT: ${{ needs.playwright.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$TARGETS" != "[]" ]; then
            test "$TEST_RESULT" = success
          fi
