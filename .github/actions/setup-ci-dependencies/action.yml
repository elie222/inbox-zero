name: Setup CI dependencies
description: Restore only the pinned pnpm package store, without virtual-store links.
outputs:
  cache-hit:
    description: Whether the exact dependency cache was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: Key for the dependency cache writer.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  store-path:
    description: Location of the pnpm package store.
    value: ${{ steps.store.outputs.path }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # Avoid accumulating old dependencies and runner-specific virtual-store links.
    - name: Restore pnpm package cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.store.outputs.path }}/files
          ${{ steps.store.outputs.path }}/index.db*
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-packages-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
